<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos y Torneos - Roller Speed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/rollerspeed.css}" href="/css/rollerspeed.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: menu}"></div>

    <div class="container my-5 flex-grow-1">
        <div class="text-center mb-5">
            <span class="badge bg-danger bg-opacity-25 text-danger px-3 py-1 mb-2 font-monospace">CRONOGRAMA DEPORTIVO (MVC + REST)</span>
            <h1 class="fw-bold text-white display-6 mb-2 brand-font">
                <i class="bi bi-calendar-check-fill text-danger me-2"></i>CALENDARIO DE EVENTOS Y COMPETICIONES
            </h1>
            <p class="text-muted fs-6">Válidas departamentales, festivales formativos y campamentos deportivos de patinaje.</p>
        </div>

        <div class="row g-4 justify-content-center">
            <div class="col-lg-9" th:each="e : ${eventos}">
                <div class="rs-card overflow-hidden" style="border-left: 4px solid var(--rs-red-primary);">
                    <div class="row g-0">
                        <div class="col-md-3 text-center p-4 d-flex flex-column justify-content-center align-items-center"
                             style="background: rgba(8, 10, 15, 0.9); border-right: 1px solid var(--rs-border-dark);">
                            <i class="bi bi-calendar-event fs-1 text-danger mb-2"></i>
                            <div class="badge bg-dark border border-secondary text-warning fw-bold text-uppercase" th:text="${e.categoria}">Torneo</div>
                        </div>
                        <div class="col-md-9">
                            <div class="p-4">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h4 class="card-title fw-bold text-white mb-0 brand-font" th:text="${e.titulo}">Título del Evento</h4>
                                    <span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-25" th:text="${e.estado}">Confirmado</span>
                                </div>
                                <p class="card-text text-muted mb-3 small" th:text="${e.descripcion}">Detalles del evento.</p>
                                <div class="small text-secondary border-top border-secondary border-opacity-25 pt-2 d-flex flex-wrap gap-3">
                                    <span><i class="bi bi-calendar-day me-1 text-warning"></i><strong class="text-light" th:text="${e.fecha}"></strong></span>
                                    <span><i class="bi bi-geo-alt-fill me-1 text-danger"></i><span class="text-muted" th:text="${e.lugar}"></span></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: pie}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
