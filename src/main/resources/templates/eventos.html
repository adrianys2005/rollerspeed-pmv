<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos y Torneos - Roller Speed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: menu}"></div>

    <div class="container my-5 flex-grow-1">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-primary display-6 mb-2">
                <i class="bi bi-calendar-check-fill text-danger me-2"></i>Calendario de Eventos y Competiciones
            </h1>
            <p class="lead text-muted">Válidas, campamentos deportivos y festivales del patinaje samario.</p>
        </div>

        <div class="row g-4 justify-content-center">
            <div class="col-lg-8" th:each="e : ${eventos}">
                <div class="card shadow-sm border-0 mb-3 overflow-hidden">
                    <div class="row g-0">
                        <div class="col-md-3 bg-dark text-white text-center p-4 d-flex flex-column justify-content-center align-items-center">
                            <i class="bi bi-calendar-event fs-1 text-warning mb-2"></i>
                            <div class="badge bg-warning text-dark fw-bold" th:text="${e.categoria}">Torneo</div>
                        </div>
                        <div class="col-md-9">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h4 class="card-title fw-bold text-primary mb-0" th:text="${e.titulo}">Título del Evento</h4>
                                    <span class="badge bg-success" th:text="${e.estado}">Confirmado</span>
                                </div>
                                <p class="card-text text-muted mb-3" th:text="${e.descripcion}">Detalles del evento.</p>
                                <div class="small text-secondary border-top pt-2 d-flex flex-wrap gap-3">
                                    <span><i class="bi bi-calendar-day me-1 text-primary"></i><strong th:text="${e.fecha}"></strong></span>
                                    <span><i class="bi bi-geo-alt-fill me-1 text-danger"></i><span th:text="${e.lugar}"></span></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: pie}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
