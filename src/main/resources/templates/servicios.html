<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestros Servicios - Roller Speed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/rollerspeed.css}" href="/css/rollerspeed.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: menu}"></div>

    <div class="container my-5 flex-grow-1">
        <div class="text-center mb-5">
            <span class="badge bg-primary bg-opacity-25 text-info px-3 py-1 mb-2 font-monospace">CATÁLOGO DEPORTIVO (MVC + REST)</span>
            <h1 class="fw-bold text-white display-6 mb-2 brand-font">
                <i class="bi bi-stars text-danger me-2"></i>PLANES Y SERVICIOS FORMATIVOS
            </h1>
            <p class="text-muted fs-6">Programas deportivos diseñados para todas las edades y niveles de habilidad sobre ruedas.</p>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-3" th:each="s : ${servicios}">
                <div class="rs-card h-100 text-center p-3 d-flex flex-column justify-content-between" style="border: 1.5px solid rgba(168, 85, 247, 0.25);">
                    <div class="p-2">
                        <span class="badge bg-dark border border-secondary text-info mb-3 text-uppercase" th:text="${s.categoria}">Categoría</span>
                        <h4 class="card-title fw-bold text-white mb-3 brand-font" th:text="${s.nombre}">Nombre Servicio</h4>
                        <p class="card-text text-muted small mb-4" th:text="${s.descripcion}">Descripción del servicio formativo o de carreras.</p>
                        
                        <div class="p-3 rounded-3 mb-3 border border-secondary border-opacity-25" style="background: rgba(8, 10, 15, 0.8);">
                            <div class="text-muted small">Tarifa Mensual</div>
                            <div class="fw-bold fs-3 text-danger font-monospace" th:text="'$' + ${#numbers.formatDecimal(s.tarifaMensual, 0, 'POINT', 0, 'COMMA')}">$ 0</div>
                            <small class="text-secondary" th:text="${s.horarioSugerido}">Horario</small>
                        </div>
                    </div>
                    <div class="pt-0">
                        <a th:href="@{/inscripcion}" class="btn btn-rs-primary w-100">Inscribirme</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: pie}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
