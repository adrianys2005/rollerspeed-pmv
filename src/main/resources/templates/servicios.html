<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestros Servicios - Roller Speed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: menu}"></div>

    <div class="container my-5 flex-grow-1">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-primary display-6 mb-2">
                <i class="bi bi-stars text-warning me-2"></i>Planes y Servicios Deportivos
            </h1>
            <p class="lead text-muted">Contenido institucional dinamizado con Thymeleaf desde la capa de servicios MVC.</p>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-3" th:each="s : ${servicios}">
                <div class="card h-100 shadow-sm border-0 text-center p-3">
                    <div class="card-body">
                        <span class="badge bg-info text-dark mb-3 text-uppercase" th:text="${s.categoria}">Categoría</span>
                        <h4 class="card-title fw-bold text-dark mb-3" th:text="${s.nombre}">Nombre Servicio</h4>
                        <p class="card-text text-muted small mb-4" th:text="${s.descripcion}">Descripción del servicio formativo o de carreras.</p>
                        
                        <div class="p-3 bg-light rounded-3 mb-3 border">
                            <div class="text-muted small">Tarifa Mensual</div>
                            <div class="fw-bold fs-4 text-primary" th:text="'$' + ${#numbers.formatDecimal(s.tarifaMensual, 0, 'POINT', 0, 'COMMA')}">$ 0</div>
                            <small class="text-secondary" th:text="${s.horarioSugerido}">Horario</small>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent border-0 pt-0">
                        <a th:href="@{/inscripcion}" class="btn btn-warning fw-bold text-dark w-100">Inscribirme</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: pie}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
