<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuerpo Técnico e Instructores - Roller Speed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/rollerspeed.css}" href="/css/rollerspeed.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: menu}"></div>

    <div class="container my-5 flex-grow-1">
        <div class="text-center mb-5">
            <span class="badge bg-warning bg-opacity-25 text-warning px-3 py-1 mb-2 font-monospace">MÓDULO DE INSTRUCTORES (MVC + REST)</span>
            <h1 class="fw-bold text-white display-6 mb-2 brand-font">
                <i class="bi bi-award-fill text-danger me-2"></i>CUERPO TÉCNICO Y ENTRENADORES
            </h1>
            <p class="text-muted fs-6">Profesionales certificados con amplia trayectoria nacional en patinaje de carreras y formación deportiva.</p>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-3" th:each="instructor : ${instructores}">
                <div class="rs-card h-100 text-center p-3 d-flex flex-column justify-content-between" style="border: 1.5px solid rgba(255, 30, 39, 0.25);">
                    <div>
                        <div class="py-3">
                            <div class="rounded-circle d-inline-flex align-items-center justify-content-center shadow"
                                 style="width: 80px; height: 80px; background: rgba(255, 30, 39, 0.15); border: 2px solid var(--rs-red-primary);">
                                <i class="bi bi-person-badge-fill fs-1 text-danger"></i>
                            </div>
                        </div>
                        <h4 class="card-title fw-bold text-white mb-1 brand-font" th:text="${instructor.nombreCompleto}">Profesor</h4>
                        <p class="text-danger small fw-semibold mb-2" th:text="${instructor.especialidad}">Especialidad</p>
                        <div class="mb-3 d-flex justify-content-center gap-1">
                            <span class="badge bg-dark border border-secondary text-warning" th:text="'Nivel ' + ${instructor.nivelAsignado}">Nivel</span>
                            <span class="badge bg-dark border border-secondary text-info" th:text="${instructor.experienciaAnios} + ' años exp.'">Experiencia</span>
                        </div>
                        <ul class="list-unstyled small text-muted text-start border-top border-secondary border-opacity-25 pt-3">
                            <li class="mb-2"><i class="bi bi-clock-history text-danger me-2"></i><span class="text-light" th:text="${instructor.horarioTurno}"></span></li>
                            <li class="mb-2"><i class="bi bi-envelope text-info me-2"></i><span class="text-light" th:text="${instructor.email}"></span></li>
                            <li><i class="bi bi-telephone text-success me-2"></i><span class="text-light" th:text="${instructor.telefono}"></span></li>
                        </ul>
                    </div>
                    <div class="pt-3">
                        <a th:href="@{/clases}" class="btn btn-rs-outline btn-sm w-100">Ver Clases Asignadas</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: pie}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
